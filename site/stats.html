<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Desk stats — Keyboard Warrior</title>
<style>body{margin:0;background:#ece4d3;color:#16130e;font:15px/1.5 ui-monospace,Menlo,monospace;padding:24px}h1{font:700 40px/1 Impact,'Arial Narrow',sans-serif;text-transform:uppercase;margin:0 0 4px}p{color:#5f574a}table{border-collapse:collapse;width:100%;max-width:1100px;margin-top:16px}th,td{border-bottom:1px solid #16130e;padding:5px 8px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}thead th{border-bottom:2px solid #16130e;font-size:11px;text-transform:uppercase;letter-spacing:.08em}</style></head>
<body><h1>Desk stats</h1><p>Anonymous daily event counts (no personal data). Source: <code>/api/stats</code>.</p><div id="o">Loading…</div>
<script>fetch('/api/stats?days=30').then(r=>r.json()).then(j=>{const days=Object.keys(j.days||{}).sort().reverse(),keys=[...new Set(days.flatMap(d=>Object.keys(j.days[d])))].sort();
document.getElementById('o').innerHTML=keys.length?'<table><thead><tr><th>Day</th>'+keys.map(k=>'<th>'+k.replace(':',' · ')+'</th>').join('')+'</tr></thead><tbody>'+days.map(d=>'<tr><td>'+d+'</td>'+keys.map(k=>'<td>'+(j.days[d][k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'No events yet.'}).catch(()=>{document.getElementById('o').textContent='Stats API offline.'})</script></body></html>
